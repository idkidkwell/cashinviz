[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true

# Allow Deploy.s.sol to write the deployment artifact (one JSON per
# chain) into ./deployments. Read-write because the script overwrites
# on re-deploy. No other paths need write access.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

# Verifier.sol (auto-generated by bb write_solidity_verifier) is massive
# and trips solc's Yul stack limits at higher optimizer_runs. Declare a
# "verifier" profile with optimizer_runs=1 and restrict the verifier file
# to that profile.
[[profile.default.additional_compiler_profiles]]
name = "verifier"
via_ir = true
optimizer_runs = 1

[[profile.default.compilation_restrictions]]
paths = "src/Verifier.sol"
optimizer_runs_min = 1
optimizer_runs_max = 1
via_ir = true

[profile.default.fuzz]
runs = 256
