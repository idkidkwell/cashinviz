[package]
name = "privacy_mixer"
version = "0.1.0"
edition = "2021"
description = "Cashinviz native Solana mixer program (Anchor)"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "privacy_mixer"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
# Enable IDL build only on demand — speeds up `cargo check` quite a bit.
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# Anchor pins to a stable release; bump in lockstep with anchor-cli
# (the CLI version determines what IDL format the program emits).
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
